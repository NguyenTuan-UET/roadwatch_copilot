name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      # tests/roadwatch needs requirements-roadwatch.txt and runs in its own workflow (roadwatch.yml, WP-C1):
      # collecting it here, without numpy and OpenCV, fails before any template test runs.
      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/roadwatch
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
