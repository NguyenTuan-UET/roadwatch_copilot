name: RoadWatch

# WP-C1: lint, tests and document checks of RoadWatch only. The template job (ci.yml) skips tests/roadwatch.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  roadwatch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-roadwatch.txt

      - name: Install dependencies
        run: |
          sudo apt-get install -y ffmpeg
          pip install -r requirements-roadwatch.txt

      - name: Lint with ruff
        run: ruff check src/roadwatch tests/roadwatch scripts/roadwatch --extend-exclude src/roadwatch/vendor

      # --confcutdir keeps the template's tests/conftest.py out. The model test is skipped unless
      # scripts/roadwatch/download_model.py ran.
      - name: Run tests
        run: python -m pytest tests/roadwatch --confcutdir=tests/roadwatch -q --tb=short

      - name: Check documents
        run: python -m scripts.roadwatch.check_docs

      - name: API schema up to date
        run: python -m scripts.roadwatch.export_api_schema --check

  docker:
    runs-on: ubuntu-latest
    needs: roadwatch
    steps:
      - uses: actions/checkout@v4

      - name: Build the demo server image
        run: docker build -f docker/roadwatch.Dockerfile -t roadwatch:ci .

      # No model in CI: /health must still answer, with "model": false.
      - name: Smoke test /health
        run: |
          docker run -d --name rw -p 127.0.0.1:8765:8765 roadwatch:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && exit 0; sleep 1; done
          docker logs rw; exit 1
