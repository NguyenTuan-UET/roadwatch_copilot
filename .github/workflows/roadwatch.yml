name: RoadWatch

# WP-C1: RoadWatch only; the template job (ci.yml) skips tests/roadwatch.
# lint -> test (coverage) -> build image + smoke test -> publish to GHCR (push to main only).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: ruff check src/roadwatch tests/roadwatch scripts/roadwatch --extend-exclude src/roadwatch/vendor --output-format=github

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-roadwatch.txt
      - name: Install dependencies
        run: |
          sudo apt-get install -y ffmpeg
          pip install -r requirements-roadwatch.txt pytest-cov

      # --confcutdir keeps the template's tests/conftest.py out. Model tests are skipped: no model in CI.
      - name: Tests with coverage
        run: python -m pytest tests/roadwatch --confcutdir=tests/roadwatch -q --tb=short --cov=src/roadwatch --cov-report=term --cov-report=xml

      - name: Documents and API schema
        run: |
          python -m scripts.roadwatch.check_docs
          python -m scripts.roadwatch.export_api_schema --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (multi-stage, layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/roadwatch.Dockerfile
          build-args: VERSION=${{ github.sha }}
          tags: roadwatch:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No model in CI: liveness answers, /health is 503 ("model": false), /health/ready is 503.
      - name: Smoke test
        run: |
          docker run -d --name rw -p 127.0.0.1:8765:8765 roadwatch:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/health/ready)" = 503
          docker inspect --format '{{.Config.User}}' roadwatch:ci | grep -qx roadwatch
          docker logs rw | tail -5

  # CD: the image a demo machine pulls (docker pull ghcr.io/<owner>/<repo>/roadwatch:<sha>). The demo itself runs
  # on the laptop behind a tunnel (docs/roadwatch-operations.md, section 7), so there is no server to deploy to.
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/roadwatch" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/roadwatch.Dockerfile
          build-args: VERSION=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:main
          cache-from: type=gha
