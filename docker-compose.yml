services:
  # RoadWatch Copilot demo server (BT-A/B). Offline: no outbound network needed after the build.
  roadwatch:
    build:
      context: .
      dockerfile: docker/roadwatch.Dockerfile
      args:
        VERSION: ${RW_VERSION:-dev}
    image: roadwatch:${RW_VERSION:-dev}
    ports:
      - "127.0.0.1:8765:8765"   # this machine only; a tunnel publishes it (scripts/roadwatch/serve_tunnel.sh)
    environment:
      - RW_KEEP_RUNS=${RW_KEEP_RUNS:-20}
      - RW_MAX_UPLOAD_MB=${RW_MAX_UPLOAD_MB:-2048}
      - RW_USER=${RW_USER:-roadwatch}
      - RW_PASSWORD=${RW_PASSWORD:-}   # from .env; never in the image or this file
      - RW_ACCOUNTS=${RW_ACCOUNTS:-1}
      - RW_COOKIE_SECURE=${RW_COOKIE_SECURE:-0}
      - RW_RTC_ICE_SERVERS=${RW_RTC_ICE_SERVERS:-}
    volumes:
      - ./models:/app/models:ro
      - ./runs/demo:/app/runs/demo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        # Measured 07/10/2026 on the demo laptop: peak 12.4 CPUs and 1.55 GiB while a run learns fy in the background
        # (4 live threads + 4 x 2 sweep threads); 20 FPS kept. Fewer CPUs: fy is learned later, not wrongly.
        limits:
          cpus: "${RW_CPUS:-12}"
          memory: 3G
        reservations:
          cpus: "4"
          memory: 2G
    restart: unless-stopped
