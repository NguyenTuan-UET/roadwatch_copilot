<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">RoadWatch Copilot</title>
  <desc id="desc">Trợ lý quan sát đường và cảnh báo bằng tiếng Việt. Biểu tượng camera theo dõi xe phía trước trên cao tốc.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#15354c"/></linearGradient>
    <linearGradient id="road" x2="0" y2="1"><stop stop-color="#294f65"/><stop offset="1" stop-color="#112433"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="180" fill="#38bdf8" opacity=".04"/>
  <circle cx="1050" cy="120" r="125" fill="none" stroke="#38bdf8" stroke-opacity=".13"/>
