    <text x="54" y="142" fill="#f0f9ff" font-size="54" font-weight="750" letter-spacing="-2">RoadWatch <tspan fill="#38bdf8">Copilot</tspan></text>
    <text x="57" y="184" fill="#c5dbe9" font-size="20">Quan sát đường. Hiểu khoảng cách. Cảnh báo đúng lúc.</text>
    <text x="57" y="244" fill="#83a5ba" font-size="13" letter-spacing="2">COMPUTER VISION  /  LOCAL INFERENCE  /  VIETNAMESE ALERTS</text>
