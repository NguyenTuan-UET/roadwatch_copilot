<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>RoadWatch Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the cockpit photo fills a fixed-ratio stage; a canvas redraws it with the live parts lifted out and animated. Single dark look. */
:root {
  --night: #030405; --ink: #e8eef4; --muted: #8d99a6; --cyan: #46d6e6; --slate: #8fb0cf;
  --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
.stage { position: relative; width: min(100vw, calc(100vh * 1673 / 940)); aspect-ratio: 1673 / 940; max-width: 100%; container-type: inline-size;
  transition: transform 1.5s cubic-bezier(.6, 0, .3, 1), filter 1.5s; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; animation: ride 2.6s ease-in-out infinite; }
@keyframes ride { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(.02%, -.05%); } 50% { transform: translate(-.02%, .03%); } 75% { transform: translate(.01%, -.02%); } }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-data); font-size: 12px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.vbtn { position: absolute; left: 0; top: 42%; width: 12.6%; height: 19%; border-radius: 40%; border: 0; background: transparent; cursor: pointer; padding: 0; z-index: 3; }
.hint { position: absolute; left: 1.2%; top: 63%; font-family: var(--font-data); font-size: max(10px, .85cqw); letter-spacing: .16em; text-transform: uppercase;
  color: var(--cyan); pointer-events: none; display: flex; gap: .6em; align-items: center; text-shadow: 0 0 8px rgba(70, 214, 230, .6); animation: blink 2.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .4; } }
.go .hint { opacity: 0; animation: none; transition: opacity .3s; }
.snd { position: absolute; right: 1.2%; top: 2%; z-index: 4; border: 1px solid rgba(255,255,255,.25); background: rgba(8,12,18,.55); color: #e8eef4;
  border-radius: 999px; padding: .35em 1em; font-family: var(--font-data); font-size: max(10px, .8cqw); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px); }
.snd[aria-pressed="false"] { color: var(--muted); }
.intro { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 9; background: #05080b; display: block; }
.web { position: fixed; inset: 0; background: #0b1015; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 10; }
.web iframe { display: block; width: 100%; height: 100%; border: 0; }
.web.on { opacity: 1; pointer-events: auto; }
.web .in { display: grid; gap: 18px; justify-items: center; max-width: 560px; }
.web .eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--slate); }
.web h1 { margin: 0; font-size: clamp(30px, 5vw, 52px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.web h1 span { color: var(--slate); font-weight: 300; }
.web p { margin: 0; color: #9aa8b5; font-size: 16px; line-height: 1.6; }
.web .back { border: 1px solid #3a4a59; background: transparent; border-radius: 4px; padding: 12px 22px; cursor: pointer; font-family: var(--font-data); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.web .back:hover { border-color: var(--slate); }
.web .logo { width: 56px; height: 56px; }
@media (prefers-reduced-motion: reduce) { .stage { transition: none; } #cv, .hint { animation: none; } }
</style>

<div class="viewport">
  <div class="stage" id="stage">
    <canvas id="cv" width="1673" height="940" role="img" aria-label="Buồng lái ô tô trên cao tốc; màn hình trung tâm đang cảnh báo va chạm với xe phía trước"></canvas>
    <div class="loading" id="loading">Đang khởi động buồng lái…</div>
    <button class="vbtn" id="vbtn" type="button" aria-label="Chạm chữ V để khởi động RoadWatch"></button>
    <div class="hint" id="hint">▲ Chạm chữ V để khởi động</div>
  </div>
</div>

<canvas class="intro" id="intro" aria-hidden="true" hidden></canvas>
<section class="web" id="web" aria-hidden="true">
  <iframe id="app" title="RoadWatch Copilot" allow="fullscreen"></iframe>
</section>

    await wait(150);
    if (!started) return;                            // left early with Escape
    await playIntro(1600);
    if (!started) return;
    if (ENTER_URL) { location.href = ENTER_URL; return; }
    $("web").classList.add("on"); $("web").setAttribute("aria-hidden", "false"); $("app").focus();
    setTimeout(() => { $("intro").hidden = true; }, 600);
  }
  function back() {
    $("web").classList.remove("on"); $("web").setAttribute("aria-hidden", "true"); zoom(false);
    $("intro").hidden = true;
    setTimeout(() => { slide = 0; calm = 0; target = 0; started = false; $("stage").classList.remove("go"); $("vbtn").focus(); }, REDUCED ? 0 : 1000);
  }
  $("vbtn").addEventListener("click", start);
  // nút "← Buồng lái" trong web demo gửi tin nhắn lên đây
  addEventListener("message", (e) => { if (e.source === $("app").contentWindow && e.data && e.data.type === "rw-back" && started) { started = false; back(); } });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && started) { started = false; back(); } });
  init();
  // nạp sẵn web demo phía sau buồng lái, để khi chạm V xong là vào ngay
  setTimeout(() => { if (!$("app").getAttribute("src")) $("app").src = "demo.html"; }, 1200);
})();
</script>
