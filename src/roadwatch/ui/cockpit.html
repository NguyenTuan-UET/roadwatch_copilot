<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RoadWatch Copilot</title>
<!-- Trang vào ở "/": buồng lái (presentation/web-demo/index.html, chạy offline). Script: /ui/cockpit.js; web app ở /app. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cpath d=%27M15 20 L50 82 L85 20%27 fill=%27none%27 stroke=%27%2313202b%27 stroke-width=%2711%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M36 20 L50 46 L64 20%27 fill=%27none%27 stroke=%27%230b8797%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
/* Ảnh buồng lái low-poly phủ sân khấu đúng tỉ lệ 1673×940; kính chắn gió khoét trống, cảnh 3D chạy phía sau. #cvs là ô cảnh phía trước của màn hình trung tâm (vẽ độ phân giải cao). Một giao diện tối. */
:root {
  --night: #030405; --ink: #e8eef4; --muted: #8d99a6; --cyan: #46d6e6; --slate: #8fb0cf;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --font-data: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
.stage { position: relative; width: min(100vw, calc(100vh * 1673 / 940)); aspect-ratio: 1673 / 940; max-width: 100%; container-type: inline-size;
  transition: transform 1.5s cubic-bezier(.6, 0, .3, 1), filter 1.5s; }
#cv, #cvs, .screen-ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; animation: ride 2.6s ease-in-out infinite; }
#cvs { inset: auto; left: 38.733%; top: 44.468%; width: 17.932%; height: 16.170%; }
/* chữ và biểu tượng của màn hình trung tâm vẽ lại bằng vector: ảnh chỉ rộng ~410 px, phóng to sẽ vỡ; SVG thì nét ở mọi mức phóng */
.screen-ui { z-index: 1; pointer-events: none; overflow: visible; }
.screen-ui text { font-family: var(--font-ui); }
.screen-ui .alert { animation: alert 0.9s ease-in-out infinite; }
@keyframes alert { 50% { opacity: .78; } }
@keyframes ride { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(.02%, -.05%); } 50% { transform: translate(-.02%, .03%); } 75% { transform: translate(.01%, -.02%); } }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-data); font-size: 12px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
/* vùng nhận thao tác vô lăng: phủ sân khấu, chỉ phản ứng trong elip vành vô lăng (xem cockpit.js) */
.wheel { position: absolute; inset: 0; z-index: 2; touch-action: none; outline: none; }
.wheel:focus-visible { outline: none; }
.wheel:focus-visible ~ .hint.steer { color: #fff; }
.vbtn { position: absolute; left: 16.6%; top: 54.6%; width: 9.2%; height: 13%; border-radius: 40%; border: 0; background: transparent; cursor: pointer; padding: 0; z-index: 3; }
.hint { position: absolute; left: 10%; top: 83.5%; font-family: var(--font-data); font-size: max(10px, .85cqw); letter-spacing: .16em; text-transform: uppercase;
  color: var(--cyan); pointer-events: none; display: flex; gap: .6em; align-items: center; text-shadow: 0 0 8px rgba(70, 214, 230, .6); animation: blink 2.2s ease-in-out infinite; z-index: 3; }
.hint.steer { top: 87.5%; color: var(--slate); text-shadow: 0 0 8px rgba(0,0,0,.8); animation: none; opacity: .85; }
@keyframes blink { 50% { opacity: .4; } }
.go .hint { opacity: 0; animation: none; transition: opacity .3s; }
.intro { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 9; background: #05080b; display: block; }
</style>
<script src="/ui/cockpit.js" defer></script>
</head>
<body>
<nav aria-label="Tài khoản" style="position:fixed;top:16px;right:16px;z-index:20;display:flex;gap:10px">
  <a href="/login" style="color:white;background:#13202be6;padding:10px 16px;border-radius:8px;text-decoration:none">Đăng nhập</a>
  <a href="/register" style="color:white;background:#0b8797;padding:10px 16px;border-radius:8px;text-decoration:none">Đăng ký</a>
</nav>
<div class="viewport">
  <div class="stage" id="stage">
    <canvas id="cv" width="1673" height="940" role="img" aria-label="Buồng lái ô tô low-poly trên cao tốc, nhìn từ ghế lái; màn hình trung tâm đang cảnh báo khoảng cách với xe phía trước"></canvas>
    <canvas id="cvs" width="1200" height="608" aria-hidden="true"></canvas>
    <svg class="screen-ui" viewBox="0 0 1673 940" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1f3a"/><stop offset="1" stop-color="#123a63"/></linearGradient>
        <linearGradient id="lanePanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16314f"/><stop offset="1" stop-color="#0b1a2c"/></linearGradient>
        <filter id="redGlow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <!-- thanh trên: làn, tốc độ, số, giờ (vẽ lại bằng vector để phóng to vẫn nét) -->
      <rect x="648" y="382" width="370" height="36" fill="url(#bar)"/>
      <g fill="none" stroke="#3fd6e8" stroke-width="1.6" stroke-linecap="round">
        <path d="M672 412 L678 390"/><path d="M700 412 L694 390"/>
        <path d="M681.5 404 L682.5 397 Q686 395 689.5 397 L690.5 404 Z M681 404 L691 404"/>
        <path d="M683.5 406.5 L683.5 409 M688.5 406.5 L688.5 409"/>
      </g>
      <text x="711" y="408" font-size="22" font-weight="700" fill="#f4f8fb">68</text>
      <text x="739" y="407" font-size="8.5" fill="#c9d6e2">km/h</text>
      <text x="914" y="409" font-size="20" font-weight="600" fill="#f4f8fb">D</text>
      <text x="1007" y="397" font-size="9.4" font-weight="600" fill="#e3eaf0" text-anchor="end">15:24</text>
      <text x="1007" y="409" font-size="9.4" font-weight="600" fill="#e3eaf0" text-anchor="end">24°C</text>
      <!-- bảng làn đường bên phải -->
      <rect x="948" y="418" width="70" height="152" fill="url(#lanePanel)"/>
      <g stroke="#3fd6e8" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".9">
        <path d="M976 430 L961 562"/><path d="M983 430 L983 562" stroke-dasharray="7 6"/><path d="M990 430 L1005 562"/>
      </g>
      <rect x="976" y="500" width="15" height="25" rx="4" fill="#eef2f5"/><rect x="978.5" y="505" width="10" height="6" rx="1.5" fill="#5b6774"/>
      <!-- cảnh báo va chạm -->
      <text x="824" y="502" font-size="8.6" font-weight="600" fill="#fff" text-anchor="middle">42 m</text>
      <g class="alert">
        <path d="M824 509 L840 537 L808 537 Z" fill="#fff" stroke="#e3202c" stroke-width="1.6" stroke-linejoin="round" filter="url(#redGlow)"/>
        <path d="M824 517 L824 528" stroke="#d81e2a" stroke-width="2.8" stroke-linecap="round"/><circle cx="824" cy="532.5" r="1.5" fill="#d81e2a"/>
        <rect x="744" y="541" width="160" height="23" rx="3" fill="#e3202c" filter="url(#redGlow)"/>
        <path d="M758 545.5 L766 559.5 L750 559.5 Z" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
        <path d="M758 549.5 L758 555" stroke="#e3202c" stroke-width="1.6" stroke-linecap="round"/><circle cx="758" cy="557.3" r="0.9" fill="#e3202c"/>
        <text x="772" y="557" font-size="11.4" font-weight="700" fill="#fff" letter-spacing=".1">CẢNH BÁO VA CHẠM</text>
      </g>
    </svg>
    <div class="loading" id="loading">Đang khởi động buồng lái…</div>
    <div class="wheel" id="wheel" tabindex="0" role="button" aria-label="Vô lăng: bấm, kéo hoặc dùng phím mũi tên để đánh lái"></div>
    <button class="vbtn" id="vbtn" type="button" aria-label="Chạm chữ V để khởi động RoadWatch"></button>
    <div class="hint" id="hint">▲ Chạm chữ V để khởi động</div>
    <div class="hint steer">⟲ Bấm hoặc kéo vô lăng để đánh lái</div>
  </div>
</div>
<canvas class="intro" id="intro" aria-hidden="true" hidden></canvas>
</body>
</html>
